{% assign current_path = page.url | remove: '/index.html' | remove: '.html' | remove: '/' %}
<nav class="site-nav" aria-label="Main navigation">
  <a href="{{ '/analyzer' | relative_url }}"{% if current_path == 'analyzer' %} aria-current="page"{% endif %}>Analyzer</a>
  <a href="{{ '/audit' | relative_url }}"{% if current_path == 'audit' %} aria-current="page"{% endif %}>Tag Audit</a>
  {% for group in site.data.navigation %}
  <details class="nav-group" name="site-navigation">
    <summary>{{ group.title }}</summary>
    <div class="nav-menu">
      {% for item in group.items %}
      {% assign item_path = item.path | remove: '/' %}
      <a href="{{ item.path | relative_url }}"{% if current_path == item_path %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </div>
  </details>
  {% endfor %}
</nav>

title: "Steam Tag Analyzer"
description: "Find commercially useful accurate Steam tags and research comparable games"
baseurl: ""
url: "https://steam-tags-analyzer.apanasik.com"
theme: minima
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
collections:
  tag_pages:
    output: true
exclude:
  - sources/
  - tools/
  - node_modules/
  - vendor/
  - tsconfig*.json
  - package*.json
  - Gemfile*
  - README.md
  - LICENSE
  - .github/
  - .env*
  - assets/models/
  - assets/data/
  - test-results/
  - playwright-report/
